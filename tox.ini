[tox]
isolated_build = True
envlist =
    py{312,313,314,315}-django{520,600}-wagtail{74,80}
    py{312,313,314,315}-django{610}-wagtail{80}

[testenv]
runner = uv-venv-runner
allowlist_externals =
    bash
deps =
    django520: django>=5.2,<5.3
    django600: django>=6.0,<6.1
    django610: django>=6.1,<6.2
    wagtail74: wagtail>=7.4,<7.5
    wagtail80: wagtail>=8.0,<8.1
setenv =
    PYTHONWARNINGS = d
commands =
    mypy {toxinidir}/wagtail_links
    coverage erase
    coverage run --branch --source wagtail_links {toxinidir}/sandbox/manage.py test --noinput wagtail_links
    - coverage report -m
